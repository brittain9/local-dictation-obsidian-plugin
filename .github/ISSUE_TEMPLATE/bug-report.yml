name: Bug Report
description: Report a bug or unexpected behavior
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug clearly and concisely.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug.
      placeholder: |
        1. Open Obsidian
        2. Enable Local Dictation
        3. ...
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g., macOS 15.3, Fedora 43, Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: architecture
    attributes:
      label: CPU architecture
      description: On Linux or macOS, `uname -m` reports this value.
      placeholder: "e.g., x86_64, arm64"
    validations:
      required: true

  - type: input
    id: installation-source
    attributes:
      label: Obsidian installation source
      placeholder: "e.g., official installer, AppImage, Debian package, tarball, Flatpak"
    validations:
      required: true

  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version
      placeholder: "e.g., 1.8.0"
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Local Dictation version
      placeholder: "e.g., 2026.7.5"
    validations:
      required: true

  - type: input
    id: linux-audio
    attributes:
      label: Linux desktop and audio stack (Linux only)
      description: Include the desktop session and the server name from `pactl info` when the problem involves audio.
      placeholder: "e.g., KDE Plasma 6 on Wayland; PulseAudio (on PipeWire 1.4)"
    validations:
      required: false

  - type: dropdown
    id: sidecar-build
    attributes:
      label: Sidecar build type
      options:
        - CPU
        - CUDA
        - Metal
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or error messages
      description: Paste any relevant console output. Enable Developer Mode in plugin settings for verbose logging.
      render: shell
    validations:
      required: false
