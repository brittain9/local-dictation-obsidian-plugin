name: Setup sidecar Rust toolchain
description: Install the pinned Rust toolchain, configure Swatinem/rust-cache, and install platform-specific native build prerequisites (Linux CMake, Windows libclang).

inputs:
  toolchain:
    description: Rust toolchain version (e.g. 1.94.1).
    required: true
  components:
    description: Comma-separated rustup components (e.g. 'rustfmt, clippy'). Empty for release builds.
    required: false
    default: ''
  cache-workspaces:
    description: Value passed to Swatinem/rust-cache 'workspaces' input.
    required: true
  cache-shared-key:
    description: Value passed to Swatinem/rust-cache 'shared-key' input.
    required: true
  cache-env-vars:
    description: Value passed to Swatinem/rust-cache 'env-vars' input. Default extends defaults with GGML, WHISPER, ORT, and CUDA so build-affecting flips (CPU SIMD, whisper flags, ONNX Runtime CUDA major, CUDA toolkit version) bust the cache.
    required: false
    # CUDA covers CUDA_TOOLKIT_VERSION, exported in the CUDA build env. The CUDA
    # toolkit version otherwise lives only in the Jimver/cuda-toolkit `uses` input
    # and is invisible to the rust-cache key, so a toolkit bump would silently
    # restore stale NVCC objects from target-cuda. Hashing it forks the key.
    default: 'CARGO CC CFLAGS CXX CMAKE RUST GGML WHISPER ORT CUDA'
  cache-on-failure:
    description: Value passed to Swatinem/rust-cache 'cache-on-failure' input.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install native build dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y cmake

    - name: Expose libclang (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: echo "LIBCLANG_PATH=$((Get-Command clang).Source | Split-Path -Parent)" >> $env:GITHUB_ENV

    # Fork the rust-cache key by Visual Studio product line (e.g. 2022 vs
    # 2026). cmake configures whisper.cpp's build dir inside target/ with a
    # VS-versioned generator, and CMake hard-fails on a generator mismatch, so
    # a cache built under one VS poisons jobs running under another (runner
    # image migrations flip VS out from under us; see release 2026.6.10).
    # rust-cache hashes CMAKE*-prefixed env vars into the key segment that is
    # also part of its fallback restore prefix, so this blocks stale restores
    # both exact and fuzzy.
    - name: Fork Rust cache key by Visual Studio version (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: echo "CMAKE_VS_PRODUCT_LINE=$(& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property catalog_productLineVersion)" >> $env:GITHUB_ENV

    - name: Setup Rust (with components)
      if: inputs.components != ''
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}

    - name: Setup Rust
      if: inputs.components == ''
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.toolchain }}

    - name: Cache Rust build
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ inputs.cache-workspaces }}
        shared-key: ${{ inputs.cache-shared-key }}
        env-vars: ${{ inputs.cache-env-vars }}
        cache-on-failure: ${{ inputs.cache-on-failure }}
