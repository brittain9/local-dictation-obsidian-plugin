name: cuda-smoke

# Fast iteration harness for the CUDA toolchain (#143). Builds ONLY the Windows
# and Linux CUDA sidecar legs — no CPU/macOS/plugin-bundle/publish — so toolchain
# and cache experiments can be measured without a full release run. Manual only.
#
# It reuses the same setup-sidecar-rust action, CUDA install, build commands, and
# rust-cache shared-keys as release.yml, so cache hit/miss behavior mirrors the
# real release path (cache-on-failure:false keeps a failed smoke run from
# poisoning the shared target-cuda cache). Run it cold then warm and read the
# timing summary on the run page to compare experiments.
on:
  workflow_dispatch:
  # TEMPORARY (remove before merge): a new workflow_dispatch workflow isn't
  # triggerable until it exists on the default branch, so during #143 validation
  # this branch-scoped push trigger lets the smoke run fire on every push.
  push:
    branches:
      - feat/faster-cuda-release-builds

permissions:
  contents: read

concurrency:
  group: cuda-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  GGML_NATIVE: 'OFF'
  ORT_CUDA_VERSION: '13'
  CUDA_TOOLKIT_VERSION: '13.2.0'
  CMAKE_CUDA_ARCHITECTURES: '75-virtual'
  NODE_VERSION: 24.14.1
  RUST_TOOLCHAIN: 1.94.1

jobs:
  cuda-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js + npm
        uses: ./.github/actions/setup-node-npm
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: ./.github/actions/setup-sidecar-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache-workspaces: native -> target-cuda
          cache-shared-key: sidecar-linux-x86_64-cuda
          cache-on-failure: 'false'

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ env.CUDA_TOOLKIT_VERSION }}
          method: network

      - name: Build sidecar
        env:
          CARGO_TIMINGS: '1'
        run: npm run build:sidecar:cuda:release

      - name: Upload cargo timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: timings-cuda-smoke-linux
          path: native/target*/cargo-timings/*.html
          if-no-files-found: ignore

  cuda-windows:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js + npm
        uses: ./.github/actions/setup-node-npm
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: ./.github/actions/setup-sidecar-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache-workspaces: native -> target-cuda
          cache-shared-key: sidecar-windows-x86_64-cuda
          cache-on-failure: 'false'

      # Mirrors release.yml's Windows CUDA toolkit cache exactly so a smoke run
      # validates the release logic. Cache the extracted toolkit dir and skip the
      # (network-variable, 3-9 min) Jimver install on a hit. CMake's CUDA language
      # support only needs nvcc on PATH + CUDA_PATH; it never reads the VS
      # BuildCustomizations .props outside CUDA_PATH, so CUDA_PATH alone suffices.
      # Key busts on toolkit version (env) OR sub-package set (committed JSON). See #143.
      - name: Resolve CUDA install dir
        shell: pwsh
        run: |
          $v = '${{ env.CUDA_TOOLKIT_VERSION }}'.Split('.')
          $dir = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v$($v[0]).$($v[1])"
          "CUDA_INSTALL_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Restore CUDA toolkit
        id: cuda-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CUDA_INSTALL_DIR }}
          key: cuda-${{ runner.os }}-${{ env.CUDA_TOOLKIT_VERSION }}-${{ hashFiles('.github/cuda-windows-subpackages.json') }}

      - name: Read CUDA sub-packages
        if: steps.cuda-cache.outputs.cache-hit != 'true'
        id: cuda-subpkgs
        shell: pwsh
        run: |
          $json = (Get-Content -Raw .github/cuda-windows-subpackages.json) -replace '\s', ''
          "list=$json" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install CUDA toolkit
        if: steps.cuda-cache.outputs.cache-hit != 'true'
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ env.CUDA_TOOLKIT_VERSION }}
          method: network
          sub-packages: ${{ steps.cuda-subpkgs.outputs.list }}

      # On a hit we skip Jimver, so replicate the env vars + PATH entry it would
      # have exported (verified against Jimver/cuda-toolkit src/update-path.ts).
      - name: Set CUDA env from cache
        if: steps.cuda-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          $v = '${{ env.CUDA_TOOLKIT_VERSION }}'.Split('.')
          $name = "CUDA_PATH_V$($v[0])_$($v[1])"
          "CUDA_PATH=$env:CUDA_INSTALL_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$name=$env:CUDA_INSTALL_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CUDA_PATH_VX_Y=$name" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$env:CUDA_INSTALL_DIR\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build sidecar
        shell: pwsh
        env:
          CARGO_TIMINGS: '1'
        run: npm run build:sidecar:cuda:windows:release

      # Save only after a green build, and only on a miss. Mirrors the build
      # cache's cache-on-failure:false — a failed/partial install never poisons
      # the (immutable-keyed) toolkit cache.
      - name: Save CUDA toolkit
        if: success() && steps.cuda-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.2
          key: ${{ steps.cuda-cache.outputs.cache-primary-key }}

      - name: Upload cargo timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: timings-cuda-smoke-windows
          path: native/target*/cargo-timings/*.html
          if-no-files-found: ignore

  report:
    needs:
      - cuda-linux
      - cuda-windows
    if: always()
    permissions:
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js + npm
        uses: ./.github/actions/setup-node-npm
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Render timing report
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-timing-report.mjs

      - name: Upload timing report
        uses: actions/upload-artifact@v7
        with:
          name: cuda-smoke-report
          path: release-report.md
